<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pay with Trust Wallet</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card">
    <h2>Complete Your Purchase</h2>
    <p class="amount-label">Amount due</p>
    <p class="amount">0.5290 BTCB <span class="network">(BEP20 · BSC)</span></p>

    <button class="pay-btn" onclick="triggerPayment()">
      <svg width="22" height="22" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="20" r="20" fill="#fff"/>
        <path d="M20 8L10 13v7c0 5.5 4.3 10.7 10 12 5.7-1.3 10-6.5 10-12v-7L20 8z" fill="#3375BB"/>
      </svg>
      Pay with Trust Wallet
    </button>

    <div id="status" class="status hidden"></div>

    <p class="note">
      You will be prompted to confirm the transaction inside Trust Wallet.<br/>
      Payment is final once confirmed on-chain.
    </p>
  </div>

  <script src="payment.js"></script>
</body>
</html>
